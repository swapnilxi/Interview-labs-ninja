<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Other</title>
  <!--
    Landing page for this class. Edit anything: the app renders this file as it is.
    Regions wrapped in lms:auto comment markers (class name, description, counts, and the
    subject / project / lesson lists) are refreshed by the app when that data changes.
    Delete a marker pair to freeze that region with whatever you put there.
    Links are relative to this file, so the class folder also works as a static site.
  -->
  <style>
    :root {
      --bg: #f7f5ef;
      --surface: #fffdf8;
      --ink: #1d1b17;
      --muted: #6b665c;
      --line: #e7e1d4;
      --accent: #5b5bd6;
      --accent-ink: #ffffff;
      --accent-soft: rgba(91, 91, 214, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14130f;
        --surface: #1d1b17;
        --ink: #f1ede4;
        --muted: #a39d90;
        --line: #33302a;
        --accent: #8b8bf0;
        --accent-ink: #14130f;
        --accent-soft: rgba(139, 139, 240, 0.16);
      }
    }
    * { box-sizing: border-box; }
    html { color-scheme: light dark; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    a { color: var(--accent); }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
    .hero {
      padding: 88px 0 56px;
      border-bottom: 1px solid var(--line);
      background: radial-gradient(1200px 420px at 10% -10%, var(--accent-soft), transparent 70%);
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .hero h1 {
      margin: 0 0 16px;
      font-size: clamp(2.4rem, 6vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    .lead { max-width: 640px; margin: 0 0 28px; font-size: 1.15rem; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
    .lms-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 8px 24px var(--accent-soft);
    }
    .lms-cta:hover { filter: brightness(1.06); }
    .stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted); }
    .lms-stat strong { color: var(--ink); }
    main { padding: 8px 20px 72px; }
    .lms-section { margin-top: 48px; }
    .lms-section h2 { margin: 0 0 18px; font-size: 1.5rem; }
    .lms-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .lms-card {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
    }
    .lms-card h3 { margin: 6px 0; font-size: 1.15rem; }
    .lms-card p { margin: 0 0 12px; font-size: 0.95rem; color: var(--muted); }
    .lms-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .lms-list { margin: 0; padding-left: 20px; }
    .lms-list li { margin: 4px 0; }
    .lms-list a { text-decoration: none; }
    .lms-list a:hover { text-decoration: underline; }
    .lms-list .lms-list { margin-top: 4px; }
    .lms-pending, .lms-muted { color: var(--muted); }
    .closing {
      margin-top: 64px;
      padding: 40px 24px;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
    }
    .closing h2 { margin: 0 0 18px; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <span class="eyebrow">Class</span>
      <h1><!-- lms:auto:name -->Other<!-- /lms:auto:name --></h1>
      <p class="lead"><!-- lms:auto:description -->Content that does not currently belong to a specific class.<!-- /lms:auto:description --></p>
      <div class="actions">
        <a class="lms-cta" href="#contents" data-lms-route="class">Enter Class &rarr;</a>
        <div class="stats"><!-- lms:auto:stats --><span class="lms-stat"><strong>0</strong> subjects</span> <span class="lms-stat"><strong>0</strong> projects</span> <span class="lms-stat"><strong>0</strong> lessons</span><!-- /lms:auto:stats --></div>
      </div>
    </div>
  </header>
  <main id="contents" class="wrap">
    <!-- lms:auto:subjects --><!-- /lms:auto:subjects -->
    <!-- lms:auto:projects --><!-- /lms:auto:projects -->
    <!-- lms:auto:lessons --><!-- /lms:auto:lessons -->
    <section class="closing">
      <h2>Ready to start learning?</h2>
      <a class="lms-cta" href="#contents" data-lms-route="class">Go to Class &rarr;</a>
    </section>
  </main>
</body>
</html>
